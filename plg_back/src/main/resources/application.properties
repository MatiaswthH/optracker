spring.application.name=plg_back

# Database: not used at runtime (DataSourceAutoConfiguration is excluded in PlgBackApplication).
# If you enable persistence, supply these through environment variables - never commit values:
#   spring.datasource.url=${DB_URL}
#   spring.datasource.username=${DB_USERNAME}
#   spring.datasource.password=${DB_PASSWORD}

# timezone
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# port
server.port=${SERVER_PORT:8080}
server.address=${SERVER_ADDRESS:0.0.0.0}

# logging
logging.level.org.springframework.web.socket=INFO
logging.level.org.springframework.web.socket.messaging=INFO
logging.level.org.springframework.web.socket.sockjs=INFO
logging.level.org.springframework.messaging=INFO
logging.level.org.springframework.messaging.simp=INFO

# CORS / WebSocket allowed origins (comma-separated). Override with APP_CORS_ALLOWED_ORIGINS.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
